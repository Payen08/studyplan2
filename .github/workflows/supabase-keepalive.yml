name: Supabase Keepalive

on:
  # 定时保活统一由 Payen08/study-plan 执行，避免重复请求。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query one study record
        env:
          SUPABASE_URL: "https://atpywxgykzhgtzhdpqbe.supabase.co"
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ANON_KEY" ]]; then
            echo "Missing repository secret: SUPABASE_ANON_KEY" >&2
            exit 1
          fi

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --max-time 30 \
            --output /dev/null \
            --header "apikey: $SUPABASE_ANON_KEY" \
            --header "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/study_progress?select=id&limit=1"
